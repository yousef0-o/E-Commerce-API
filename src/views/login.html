<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Login | ApexStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Navigation Bar -->
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-3 text-xl font-black tracking-tight text-white group">
        <span class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform">
          <i class="fa-solid fa-bag-shopping"></i>
        </span>
        <span>Apex<span class="text-indigo-400">Store</span></span>
      </a>
      <div class="flex items-center space-x-4">
        <a href="/" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Store
        </a>
        <a href="/api/docs" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-mono transition-colors">
          <i class="fa-solid fa-book mr-1 text-indigo-400"></i> Swagger Docs
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-indigo-950/50 backdrop-blur relative overflow-hidden">
      
      <!-- Ambient glow effect -->
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-violet-600/20 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Header & Tabs -->
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-white tracking-tight" id="modalTitle">Welcome Back</h1>
        <p class="text-xs text-slate-400 mt-1" id="modalSubtitle">Sign in to access your cart, orders, and preferences</p>
      </div>

      <!-- Quick Demo Access Pills -->
      <div class="mb-6 bg-slate-800/60 p-3 rounded-2xl border border-slate-700/50 text-xs">
        <p class="font-semibold text-slate-300 mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-bolt text-amber-400"></i> Instant 1-Click Demo Logins:
        </p>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="fillLogin('customer@ecommerce.com', 'Customer@123')" class="py-1.5 px-2.5 rounded-xl bg-slate-700/70 hover:bg-indigo-600/30 border border-slate-600/50 hover:border-indigo-500/50 text-left transition-all group">
            <div class="font-semibold text-indigo-300 group-hover:text-indigo-200">Customer</div>
            <div class="text-[10px] text-slate-400 truncate">customer@ecommerce.com</div>
          </button>
          <button onclick="fillLogin('admin@ecommerce.com', 'Admin@123')" class="py-1.5 px-2.5 rounded-xl bg-slate-700/70 hover:bg-amber-600/30 border border-slate-600/50 hover:border-amber-500/50 text-left transition-all group">
            <div class="font-semibold text-amber-300 group-hover:text-amber-200">Admin</div>
            <div class="text-[10px] text-slate-400 truncate">admin@ecommerce.com</div>
          </button>
        </div>
      </div>

      <!-- Toggle Tab Buttons -->
      <div class="flex rounded-xl bg-slate-950 p-1 mb-6 border border-slate-800">
        <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow">
          Sign In
        </button>
        <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
          Create Account
        </button>
      </div>

      <!-- Error / Alert banner -->
      <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs flex items-start gap-2.5">
        <i id="alertIcon" class="fa-solid fa-circle-exclamation mt-0.5"></i>
        <div id="alertMessage" class="flex-1"></div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="email" id="loginEmail" required placeholder="you@example.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-medium text-slate-300">Password</label>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
          </div>
        </div>
        <button type="submit" id="loginSubmitBtn" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 font-semibold text-xs text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
          <span>Sign In to Account</span>
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="text" id="regName" required placeholder="Alex Turner" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="email" id="regEmail" required placeholder="alex@example.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Password (min 6 chars)</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="password" id="regPassword" minlength="6" required placeholder="Create secure password" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Shipping Address (optional)</label>
          <div class="relative">
            <i class="fa-solid fa-location-dot absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="text" id="regAddress" placeholder="123 Ocean Ave, Santa Monica, CA" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
          </div>
        </div>
        <button type="submit" id="regSubmitBtn" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 font-semibold text-xs text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
          <span>Create My Account</span>
          <i class="fa-solid fa-user-plus text-[10px]"></i>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
    <p>E-Commerce REST API & Storefront Engine • JWT Secured • Stripe Integrated</p>
  </footer>

  <script>
    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const title = document.getElementById('modalTitle');
      const subtitle = document.getElementById('modalSubtitle');
      hideAlert();

      if (mode === 'login') {
        tabLogin.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow';
        tabRegister.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white';
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        title.textContent = 'Welcome Back';
        subtitle.textContent = 'Sign in to access your cart, orders, and preferences';
      } else {
        tabRegister.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow';
        tabLogin.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white';
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        title.textContent = 'Create an Account';
        subtitle.textContent = 'Join ApexStore for fast checkout & exclusive catalog access';
      }
    }

    function fillLogin(email, password) {
      switchTab('login');
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
      showAlert('Demo credentials filled! Click "Sign In to Account" or submit.', 'info');
    }

    function showAlert(message, type = 'error') {
      const box = document.getElementById('alertBox');
      const msg = document.getElementById('alertMessage');
      const icon = document.getElementById('alertIcon');

      box.classList.remove('hidden');
      msg.textContent = message;

      if (type === 'error') {
        box.className = 'mb-4 p-3 rounded-xl text-xs flex items-start gap-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-300';
        icon.className = 'fa-solid fa-circle-exclamation mt-0.5 text-rose-400';
      } else if (type === 'success') {
        box.className = 'mb-4 p-3 rounded-xl text-xs flex items-start gap-2.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300';
        icon.className = 'fa-solid fa-circle-check mt-0.5 text-emerald-400';
      } else {
        box.className = 'mb-4 p-3 rounded-xl text-xs flex items-start gap-2.5 bg-indigo-500/10 border border-indigo-500/30 text-indigo-300';
        icon.className = 'fa-solid fa-circle-info mt-0.5 text-indigo-400';
      }
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Login failed');
        }

        // Save token & user profile in localStorage for client-side persistence
        localStorage.setItem('token', data.data.token);
        localStorage.setItem('user', JSON.stringify(data.data.user));

        showAlert('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          if (data.data.user.role === 'ADMIN') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        }, 600);
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Account</span><i class="fa-solid fa-arrow-right text-[10px]"></i>';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const address = document.getElementById('regAddress').value;
      const btn = document.getElementById('regSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, address }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Registration failed');
        }

        localStorage.setItem('token', data.data.token);
        localStorage.setItem('user', JSON.stringify(data.data.user));

        showAlert('Account registered successfully! Welcome aboard.', 'success');

        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Create My Account</span><i class="fa-solid fa-user-plus text-[10px]"></i>';
      }
    }
  </script>
</body>
</html>
